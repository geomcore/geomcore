name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env: { RUSTDOCFLAGS: "-D warnings" }
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor of the abi3 wheel, the oldest Python not yet at end of
        # life, and the latest release.
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p geomcore-py
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install maturin pytest mypy numpy
      - run: maturin build --manifest-path geomcore-py/Cargo.toml --out dist
      - run: pip install --no-index --find-links dist geomcore
      - run: pytest geomcore-py/tests
      # The allowlist names operator methods that only newer Pythons
      # report, so the stubs are checked on the latest release.
      - if: matrix.python-version == '3.15'
        run: python -m mypy.stubtest geomcore --allowlist geomcore-py/stubtest-allowlist.txt
  benchmark-budget:
    # Counts instructions under valgrind. The budget in benches/budget.tsv
    # was measured with this exact toolchain and criterion release, so the
    # counts move only when the code does. Runs on pull requests only: the
    # check compares against the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # Cargo.lock is not committed, so pin criterion to the release the
      # budget was measured with.
      - run: cargo update -p criterion --precise 0.7.0
      - run: git fetch --no-tags --depth=1 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
      - run: python3 scripts/benchmark_budget.py check --base origin/${{ github.base_ref }}
