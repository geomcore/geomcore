site_name: geomcore
site_url: https://geomcore.github.io/geomcore/
repo_url: https://github.com/geomcore/geomcore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.tabs.link

hooks:
  - docs_hooks/hooks.py

extra:
  # Base URL of the hosted viewer used by ```viewer blocks in the docs.
  viewer_url: https://geomcore.github.io/geomcore-viewer/
  # Published root the relative scene paths resolve against. Keeping this
  # separate from site_url lets `mkdocs serve` preview the deployed scenes.
  scene_base_url: https://geomcore.github.io/geomcore/

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables

extra_css:
  - stylesheets/figures.css
  - stylesheets/highlight.css
  - stylesheets/viewer.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js
  - javascripts/mathjax.js

nav:
  - Home: index.md
  - Tutorials:
    - Getting started: getting-started.md
  - How-to guides:
    - Visualize with the viewer: viewer.md
    - Projection & containment: guides/projection.md
    - Intersection: guides/intersection.md
    - Discretize a curve: guides/discretization.md
    - Map a curve onto a surface: guides/parametrization.md
  - Reference:
    - Elementary curves & surfaces: geometry/elementary.md
    - NURBS:
      - Curves: nurbs/curves.md
      - Surfaces: nurbs/surfaces.md
      - Editing & fitting: nurbs/editing-fitting.md
    - Python API: python.md
    - Throughput baseline: benchmarks.md
  - Explanation:
    - "NURBS: from Bézier to B-spline": nurbs/index.md
    - Why ten special cases: explanation/why-ten-special-cases.md
    - Design decisions: adr/index.md
    - Roadmap: roadmap.md

exclude_docs: |
  superpowers/*
  agents/*
